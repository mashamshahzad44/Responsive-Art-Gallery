<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Gallery</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background-color: #111;
    color: #eee;
    padding: 40px 20px;
  }

  .gallery-title {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 30px;
    letter-spacing: 1px;
  }
.gallery-column{
  max-width: 20%;
  flex:20%;
  padding:4px;
}
.gallery{
  display: flex;
  flex-wrap: wrap;
}
.gallery-column img{
  width: 100%;
  border-radius: 4px;
  margin-bottom: 4px;
}
/* 3 columns */
@media all and (max-width:1200px){     
  .gallery-column{
  max-width: 33.333%;
  flex: 33.333%;
}
}
/* 2 columns in tablet*/
@media all and (max-width:960px){
  .gallery-column{
  max-width: 50%;
  flex: 50%;
}
}
/* 1 column in mobile phone */
@media all and (max-width:500px){
  .gallery-column{
  max-width: 100%;
  flex: 100%;
}
}
  
</style>
</head>
<body>

  <h1 class="gallery-title">Art Gallery</h1>
